<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Manager</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --color-primary: #28a745;
            --color-primary-hover: #218838;
            --color-text: #333;
            --color-text-secondary: #555;
            --color-border: #ccc;
            --color-background: #f4f4f9;
            --color-background-card: #ffffff;
            --shadow-default: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius-default: 4px;
            --radius-lg: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--color-background);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .container {
            background: var(--color-background-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-default);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: var(--color-text);
            font-size: 1.5rem;
            margin: 0 0 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            font-size: 0.95rem;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-default);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .muted {
            display: block;
            margin-top: 0.35rem;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-default);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--color-primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Add New To-Do Item</h1>
    <form action="/submittodoitem" method="POST">
        <div class="form-group">
            <label for="itemID">Item ID</label>
            <input type="text" id="itemID" name="itemID" placeholder="Item ID" readonly>
            <span class="muted">Auto-generated on page load</span>
        </div>
        <div class="form-group">
            <label for="itemUUID">Item UUID</label>
            <input type="text" id="itemUUID" name="itemUUID" placeholder="Item UUID" readonly>
            <span class="muted">Auto-generated on page load</span>
        </div>


        <div class="form-group">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" name="itemName" placeholder="e.g., Buy groceries" required>
        </div>

        <div class="form-group">
            <label for="itemDescription">Item Description</label>
            <textarea id="itemDescription" name="itemDescription" placeholder="Describe the task..." required></textarea>
        </div>

       
        <button type="submit">Add to List</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var idInput = document.getElementById('itemID');
    var uuidInput = document.getElementById('itemUUID');
    if (idInput && !idInput.value) {
        idInput.value = Date.now().toString();
    }
    if (uuidInput && !uuidInput.value) {
        if (window.crypto && crypto.randomUUID) {
            uuidInput.value = crypto.randomUUID();
        } else {
            uuidInput.value = 'uuid-' + Math.random().toString(36).slice(2, 10);
        }
    }
});
</script>
</body>
</html>
